[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Autonomous financial research agent"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_research_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
