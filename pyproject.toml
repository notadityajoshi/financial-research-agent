[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Autonomous financial research agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.140.0",
    "feedparser>=6.0.12",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "langfuse>=4.14.2",
    "langgraph>=1.2.9",
    "lxml>=6.1.1",
    "mcp[cli]>=1.2.0",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "streamlit>=1.60.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_research_agent"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
